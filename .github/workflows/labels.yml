name: Sync kind labels

on:
  push:
    branches: [main]
    paths:
      - scripts/element-kinds.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure kind labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kinds=$(node -e "console.log(JSON.parse(require('fs').readFileSync('scripts/element-kinds.json','utf8')).join('\n'))")
          for kind in $kinds featured; do
            name="kind:${kind}"
            if [ "$kind" = featured ]; then name=featured; fi
            color=FF9500
            if [ "$kind" = featured ]; then color=6E40C9; fi
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/labels" \
              -d "{\"name\":\"${name}\",\"color\":\"${color}\",\"description\":\"Scheme uses ${kind}\"}" \
              >/dev/null || true
          done
